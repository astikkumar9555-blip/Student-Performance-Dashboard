<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Dashboard</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="parallax-background"></div>
    <div class="dashboard"></div>
    <div class="main-first">
         <div class="first">
        <h1 class="first-class-1">Student Performance Dashboard</h1>
        <h2 class="first-class-2">Analyze student academic performance</h2>
    </div>
    </div>
   <div class="main-second">
    <div class="second">
    <label for="name">Select Student:</label>
    <select name="name" id="name">
        <option value="Select Student ">Select Student</option>
        <option value="Ashutosh ">Ashutosh Kumar</option>
        <option value="Aman">Aman</option>
        <option value="Rahul">Rahul</option>
        <option value="Rohit">Rohit</option>
    </select>
   
    </div> 
   </div>

     <div class="main-third">
        <div class="third">
        <h1>Student Information</h1>
        <ul>
         <li><h1> Name</h1> </li>
         <li><h1>Roll Number</h1></li>
        </ul>
         <ul class="fourth">
         <li>---</li>
         <li>---</li>
        </ul>
    </div> 
     </div>
        
     <div class="main-fourth">
         <div class="fourth-1">
            <h1>Total Marks</h1>
       <ul>
        <li class="fourth-list-1">---</li>
       </ul>
         </div>

        <div class="fourth-2">
           <h1>Percentage</h1>
           <ul class="fourth-list-2">---</li>
           </ul>
        </div>

        <div class="fourth-3">
            <h1>Grade</h1>
            <ul class="fourth-list-3">
                <li>---</li>
            </ul>
        </div>
         
    </div>
    <section class="main-fifth">
        <div class="fifth-div">
             <h1>Student Performance</h1>
        <table>
            <thead>
                 <tr>
                <td>Subject</td>
                <td>Marks</td>
            </tr>
            </thead>
             
        </table>
        </div>
    </section>

    <section class="Second-last">
        <li>
             <button class="button-1">
            Show Total Marks
        </button>
        <button>
            Show Percentage
        </button>
        <button>
            Show Grads
        </button>
        </li>
    </section>

    <section class="result">
        <div class="result-div">
        <h1>Result</h1>
        <h2>Select a student and click a botton</h2>
    
        </div>
    </section>
</body>
</html>
